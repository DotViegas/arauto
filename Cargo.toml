[workspace]
resolver = "3"
members = ["crates/arauto-protocol", "crates/arauto-platform", "crates/arauto-hub", "crates/arauto-connector", "crates/arauto-testkit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

# One place for every version. Crates pick what they need with `workspace = true`.
[workspace.dependencies]
arauto-protocol = { path = "crates/arauto-protocol" }
arauto-platform = { path = "crates/arauto-platform" }
arauto-hub = { path = "crates/arauto-hub" }
arauto-connector = { path = "crates/arauto-connector" }
arauto-testkit = { path = "crates/arauto-testkit" }

anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws", "json", "query"] }
bytes = "1.12.1"
# `zeroize`: the key copy inside each cipher object is wiped when it is dropped.
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dashmap = "6.2.1"
data-encoding = "2.11.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
hkdf = "0.13.0"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "http1", "service"] }
# The TLS of the connector (`wss://`), only under its `tls` feature: the `ring` provider compiles
# C, and the development machine has no C compiler for the Linux target.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# Only the suite the protocol uses (25519, ChaChaPoly, BLAKE2s), pure Rust: the default
# feature set would pull a C library and stop cross-target checks.
snow = { version = "0.10.0", default-features = false, features = ["default-resolver", "use-curve25519", "use-chacha20poly1305", "use-blake2", "use-getrandom"] }
# No TLS towards the database: it sits on the same private network as the hub.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "migrate", "json", "macros"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
# Client side only (the test connector, later the connector). No TLS here: `ws://` on the
# local machine. The connector adds its TLS feature in its own manifest.
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.29.2", features = ["serde"] }
# The public roots built into the connector, for its `tls` feature.
webpki-roots = "0.26.11"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = "1.9.1"

# Tests only.
proptest = "1.12.0"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.dev]
# Crypto is painfully slow without optimisation; keep our own crates debuggable.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
