[package]
name = "arauto-hub"
description = "The Arauto hub: connector port, vault, audit, peers and the admin command."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "arauto_hub"
path = "src/lib.rs"

[[bin]]
name = "arauto-hub"
path = "src/main.rs"

[dependencies]
arauto-platform.workspace = true
arauto-protocol.workspace = true

anyhow.workspace = true
axum.workspace = true
bytes.workspace = true
chacha20poly1305.workspace = true
clap.workspace = true
dashmap.workspace = true
data-encoding.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hkdf.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal", "net", "io-util"] }
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["v4"] }
webauthn_rp.workspace = true
zeroize.workspace = true

[dev-dependencies]
arauto-protocol = { workspace = true, features = ["testing"] }
arauto-testkit.workspace = true
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
